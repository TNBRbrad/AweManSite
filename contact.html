<!DOCTYPE html>
<html>
<head>
    <title>Awe-Mans Website - Contact</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        #contactForm {
            max-width: 450px;
            border: 2px solid #1d4ed8;
            padding: 20px;
            margin: 20px;
        }
        #successMsg {
            display: none;
            color: #1d4ed8;
            font-weight: bold;
        }
        #errorMsg {
            display: none;
            color: red;
            font-weight: bold;
        }
    </style>
    <script>
        function submitContactForm() {
            var name = document.getElementById("cName").value;
            var email = document.getElementById("cEmail").value;
            var message = document.getElementById("cMessage").value;
            var reasonRadios = document.getElementsByName("reason");
            var terms = document.getElementById("cTerms").checked;

            var reason = "";
            for (var i = 0; i < reasonRadios.length; i++) {
                if (reasonRadios[i].checked) {
                    reason = reasonRadios[i].value;
                }
            }

            var successMsg = document.getElementById("successMsg");
            var errorMsg = document.getElementById("errorMsg");

            if (name == "" || email == "" || message == "" || reason == "" || terms == false) {
                errorMsg.style["display"] = "block";
                successMsg.style["display"] = "none";
                errorMsg.innerHTML = "Please fill in all fields, choose a reason, and agree to the terms.";
            } else {
                console.log("Name: " + name);
                console.log("Email: " + email);
                console.log("Message: " + message);
                console.log("Reason: " + reason);
                console.log("Agreed to terms: " + terms);

                successMsg.style["display"] = "block";
                errorMsg.style["display"] = "none";
                successMsg.innerHTML = "Thanks, " + name + "! Your message has been sent.";
            }

            return false;
        }
    </script>
</head>
<body>

    <div id="header">
        <h1><img src="AWeManEmoji.png" alt="Awe-Man icon" style="height:36px; vertical-align:middle; margin-right:8px;">Awe-Mans Website</h1>
        <div id="navbar">
            <a class="navlink" href="index.html">Home</a>
            <a class="navlink" href="about.html">About</a>
            <a class="navlink" href="portfolio.html">Portfolio</a>
            <a class="navlink" href="contact.html">Contact</a>
        </div>
    </div>

    <div id="maincontent">
        <div id="contactForm">
            <h1>Contact Form</h1>
            <form onsubmit="return submitContactForm()">
                <div>
                    <label for="cName">Name:</label>
                    <input type="text" id="cName" name="cName">
                </div>
                <div>
                    <label for="cEmail">Email:</label>
                    <input type="email" id="cEmail" name="cEmail">
                </div>
                <div>
                    <label for="cMessage">Message:</label><br>
                    <textarea id="cMessage" name="cMessage" rows="4" cols="30"></textarea>
                </div>
                <div>
                    <label>Reason for Contact:</label><br>
                    <input type="radio" id="reasonGeneral" name="reason" value="General Question">
                    <label for="reasonGeneral" style="width:auto;">General Question</label><br>
                    <input type="radio" id="reasonSupport" name="reason" value="Support">
                    <label for="reasonSupport" style="width:auto;">Support</label><br>
                    <input type="radio" id="reasonPartnership" name="reason" value="Partnership">
                    <label for="reasonPartnership" style="width:auto;">Partnership</label>
                </div>
                <div>
                    <input type="checkbox" id="cTerms" name="cTerms">
                    <label for="cTerms" style="width:auto;">I agree to the terms and conditions</label>
                </div>
                <div>
                    <input type="submit" value="Submit">
                </div>
                <p id="successMsg"></p>
                <p id="errorMsg"></p>
            </form>
        </div>
    </div>

    <div id="footer">
        Website created by Bradley Adams
    </div>

</body>
</html>
