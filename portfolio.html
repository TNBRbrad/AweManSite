<!DOCTYPE html>
<html>
<head>
    <title>Awe-Mans Website - Portfolio</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        .tile {
            float: left;
            width: 230px;
            border: 1px solid #e2e2e2;
            background-color: #ffffff;
            margin: 0 15px 15px 0;
            padding: 8px;
            text-align: center;
            font-size: 13px;
        }
        .tile img {
            width: 220px;
            height: 300px;
            object-fit: contain;
            background-color: #ffffff;
        }
        .tile p {
            margin: 8px 0 0 0;
        }
        #tilesArea {
            overflow: auto;
        }
        #feedbackArea {
            clear: both;
        }
        #confirmMsg {
            display: none;
            color: #1d4ed8;
            font-weight: bold;
        }
    </style>
    <script>
        function tileOver(tile) {
            tile.style["border-color"] = "#1d4ed8";
            tile.style["background-color"] = "#fde047";
        }

        function tileOut(tile) {
            tile.style["border-color"] = "#93c5fd";
            tile.style["background-color"] = "#eff6ff";
        }

        function submitFeedback() {
            var name = document.getElementById("fbName").value;
            var email = document.getElementById("fbEmail").value;
            var feedback = document.getElementById("fbText").value;

            var entry = {
                name: name,
                email: email,
                feedback: feedback
            };

            window.localStorage.setItem("portfolioFeedback", JSON.stringify(entry));

            var msg = document.getElementById("confirmMsg");
            msg.style["display"] = "block";
            msg.innerHTML = "Thanks, " + name + "! Your feedback has been saved.";

            return false;
        }
    </script>
</head>
<body>

    <div id="header">
        <h1><img src="AWeManEmoji.png" alt="Awe-Man icon" style="height:36px; vertical-align:middle; margin-right:8px;">Awe-Mans Website</h1>
        <div id="navbar">
            <a class="navlink" href="index.html">Home</a>
            <a class="navlink" href="about.html">About</a>
            <a class="navlink" href="portfolio.html">Portfolio</a>
            <a class="navlink" href="contact.html">Contact</a>
        </div>
    </div>

    <div id="maincontent">
        <h1>My Portfolio</h1>

        <div id="tilesArea">
            <div class="tile" onmouseover="tileOver(this)" onmouseout="tileOut(this)">
                <img src="Awe-Mans Pokemon Team.png" alt="Awe-Man's Pokemon Team">
                <p><strong>Project 1</strong><br>Awe-Man's Pokemon Team.</p>
            </div>
            <div class="tile" onmouseover="tileOver(this)" onmouseout="tileOut(this)">
                <img src="team_up_cover.jpg" alt="Team Up Cover">
                <p><strong>Project 2</strong><br>Team-Up Cover.</p>
            </div>
            <div class="tile" onmouseover="tileOver(this)" onmouseout="tileOut(this)">
                <img src="awwwman_emerald_fox_cross_over.jpg" alt="Emerald Fox Crossover">
                <p><strong>Project 3</strong><br>Emerald Fox Crossover.</p>
            </div>
        </div>

        <div id="feedbackArea" class="section">
            <h2>Provide Your Feedback</h2>
            <form onsubmit="return submitFeedback()">
                <div>
                    <label for="fbName">Name:</label>
                    <input type="text" id="fbName" name="fbName">
                </div>
                <div>
                    <label for="fbEmail">Email:</label>
                    <input type="email" id="fbEmail" name="fbEmail">
                </div>
                <div>
                    <label for="fbText">Your Feedback:</label><br>
                    <textarea id="fbText" name="fbText" rows="4" cols="35"></textarea>
                </div>
                <div>
                    <input type="submit" value="Submit Feedback">
                </div>
                <p id="confirmMsg"></p>
            </form>
        </div>
    </div>

    <div id="footer">
        Website created by Bradley Adams
    </div>

</body>
</html>
